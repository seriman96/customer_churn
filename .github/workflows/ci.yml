
name: Customer Churn CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          python -m pytest -v

  build-and-push:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-smoke-test:
    name: Verify running Docker container
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published Docker image
        run: |
          docker pull ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Start API container
        run: |
          docker run -d \
            --name customer-churn-api \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Check API health
        run: |
          set -e

          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "API health check passed."
              exit 0
            fi

            echo "Waiting for API to start... ($i/30)"
            sleep 2
          done

          echo "API failed to become healthy."
          docker logs customer-churn-api
          exit 1

      - name: Test prediction endpoint
        run: |
          set -e

          response=$(curl --fail --silent --show-error \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "gender": "Male",
              "SeniorCitizen": 0,
              "Partner": "Yes",
              "Dependents": "No",
              "tenure": 12,
              "PhoneService": "Yes",
              "MultipleLines": "Yes",
              "InternetService": "DSL",
              "OnlineSecurity": "No",
              "OnlineBackup": "Yes",
              "DeviceProtection": "No",
              "TechSupport": "No",
              "StreamingTV": "Yes",
              "StreamingMovies": "No",
              "Contract": "Month-to-month",
              "PaperlessBilling": "Yes",
              "PaymentMethod": "Electronic check",
              "MonthlyCharges": 70.0,
              "TotalCharges": 840.0
            }')

          echo "Prediction response: $response"

          python -c '
          import json, sys
          result = json.loads(sys.argv[1])
          assert result["prediction"] in ["Likely to churn", "Not likely to churn"]
          assert 0 <= result["churn_probability"] <= 1
          assert 0 <= result["threshold"] <= 1
          print("Prediction endpoint test passed.")
          ' "$response"

      - name: Show container logs
        if: failure()
        run: docker logs customer-churn-api || true

      - name: Stop container
        if: always()
        run: docker rm -f customer-churn-api || true
